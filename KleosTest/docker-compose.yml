services:

  postgres:
    image: postgres:16-alpine
    container_name: kleos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kleos
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kleos_db
    ports:
      - "5432:5432"
    volumes:
      - kleos_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kleos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kleos_redis_data:/data

volumes:
  kleos_postgres_data:
  kleos_redis_data: